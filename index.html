.macro{display:flex;gap:16px}
.macro div{flex:1;text-align:center}

.macro span{font-size:11px;color:var(--muted)}
.barra{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden;margin-top:8px}

.agua{display:flex;align-items:center;justify-content:center;gap:18px}
.agua b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.lin2{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.lin2:first-child{border-top:0}
.lin2 .tx{flex:1;min-width:0}

.tot b{font-family:var(--display);font-size:19px;display:block;font-variant-numeric:tabular-nums}
.tot span{font-size:11px;color:var(--muted)}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.gbox p{margin:0;font-size:13.5px;color:var(--soft)}

@media (min-width:700px){.velo{align-items:center}.hoja{border-radius:16px}}
</style>

/* ============================================================
   NÚCLEO DE SINCRONIZACIÓN
   ============================================================ */
function pintaSync(){
  const el = $("sync"), tx = $("syncTx"), ms = KEYS.map(k => meta[k] || {});
  el.className = "sync";
  if (errTx) { el.classList.add("bad"); tx.textContent = errTx; }
  else if (!ms.every(m => m.listo)) tx.textContent = navigator.onLine ? "Cargando tus datos…" : "Sin conexión: esperando la nube";
  else if (ms.some(m => m.pend)) { el.classList.add("busy"); tx.textContent = navigator.onLine ? "Guardando…" : "Sin conexión: se guardará al reconectar"; }
  else if (ms.some(m => m.cache)) { el.classList.add("busy"); tx.textContent = "Sin conexión con la nube"; }
  else { el.classList.add("ok"); tx.textContent = "Sincronizado"; }
}
/* Guarda una colección completa. Se niega si esa colección aún no llegó de la nube
   (así nunca se pisa lo que hay en la nube con una lista vacía). */
function guardar(k, callado){
  if (!uid || !(meta[k] && meta[k].listo)) { toast("Tus datos aún están cargando; intenta en un momento"); return false; }
  errTx = "";
  fs.doc("users/" + uid + "/data/" + k).set({ items: JSON.parse(JSON.stringify(DB[k])), updated: firebase.firestore.FieldValue.serverTimestamp() })
    .catch(e => { errTx = "No se guardó en la nube (" + (e.code || e.message) + ")"; pintaSync(); });
  if (!callado) pinta();
  return true;
}
function conectar(){
  KEYS.forEach(k => {
    bajas.push(fs.doc("users/" + uid + "/data/" + k).onSnapshot({includeMetadataChanges:true}, s => {
      const m = s.metadata, items = s.exists ? (s.data().items || []) : [];
      /* "listo" = la nube respondió, o hay copia en caché de un documento que sí existe */
      meta[k] = { listo: (meta[k] && meta[k].listo) || !m.fromCache || s.exists, pend: m.hasPendingWrites, cache: m.fromCache };
      const txt = JSON.stringify(items);
      if (txt !== JSON.stringify(DB[k])) { DB[k] = JSON.parse(txt); pinta(); }
      pintaSync();
    }, e => { errTx = "Error de sincronización (" + e.code + ")"; pintaSync(); }));
  });
}
function desconectar(){ bajas.forEach(b => { try { b(); } catch(e){} }); bajas = []; KEYS.forEach(k => { DB[k] = []; delete meta[k]; }); uid = null; }

/* ---------- acceso con Google ---------- */
function gError(e){ const c = e && (e.code || e.message) || "";
  $("gErr").textContent = !c ? "" : c.includes("unauthorized-domain") ? "Este dominio no está autorizado. En Firebase: Authentication → Settings → Dominios autorizados → agrega " + location.hostname
    : c.includes("operation-not-allowed") ? "Falta habilitar Google en Firebase: Authentication → Sign-in method."
    : c.includes("network") ? "Sin conexión a internet." : "No se pudo iniciar sesión (" + c + ")"; }
let entrando = false;
const proveedor = () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); return p; };
async function entrar(){
  if (entrando) return; entrando = true; gError(null);
  try { await auth.signInWithPopup(proveedor()); }
  catch(e){ const c = e.code || "";
    if (/popup-blocked|cancelled-popup-request|operation-not-supported|web-storage-unsupported/.test(c)) {
      try { await auth.signInWithRedirect(proveedor()); return; } catch(e2){ gError(e2); } }
    else if (!/popup-closed-by-user/.test(c)) gError(e); }
  entrando = false;
}
async function arrancar(){
  $("gVer").textContent = "versión " + VERSION; $("ver").textContent = "v" + VERSION;
  if (typeof firebase === "undefined") { $("gMsg").textContent = "No se pudo cargar Firebase. Revisa tu conexión y recarga la página."; return; }
  try {
    firebase.initializeApp(firebaseConfig); auth = firebase.auth(); fs = firebase.firestore();
    try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e){ /* sin caché sin conexión: no afecta la sincronización */ }
    try { await auth.getRedirectResult(); } catch(e){ gError(e); }
    auth.onAuthStateChanged(u => {
      if (u) { uid = u.uid; $("gate").hidden = true; $("quien").textContent = u.email || u.displayName || "Sesión iniciada"; conectar(); pinta(); pintaSync(); }
      else { desconectar(); $("gate").hidden = false; $("gMsg").textContent = "Inicia sesión para ver y sincronizar tus datos en todos tus dispositivos.";
        $("gEntrar").hidden = false; $("gRedir").hidden = false; }
    });
  } catch(e){ $("gMsg").textContent = "Error al iniciar Firebase: " + (e.message || e.code); }
}
$("gEntrar").onclick = entrar;
$("gRedir").onclick = () => { gError(null); auth.signInWithRedirect(proveedor()).catch(gError); };
$("salir").onclick = () => auth.signOut().then(() => location.reload());
window.addEventListener("online", pintaSync); window.addEventListener("offline", pintaSync);

    else if (q("[data-nb]")) hojaBloque(null, sub === "aj" ? {rep:"semanal"} : null);
    else if (b = q("[data-eb]")) hojaBloque(b.dataset.eb);
    else if (b = q("[data-dia]")) { fecha = b.dataset.dia; sub = "dia"; document.querySelectorAll("#tSeg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === "dia")); pintaT(); }
    else if (b = q("[data-mes]")) { const n = +b.dataset.mes; mesRef = n ? new Date(mesRef.getFullYear(), mesRef.getMonth() + n, 1) : new Date(); pintaT(); }
    else if (q("[data-pa]")) { const tx = $("pTx").value.trim(); if (!tx) { toast("Escribe el pendiente"); return; }
      const lim = (v,a,z,d) => Math.min(z, Math.max(a, parseInt(v, 10) || d));
      DB.pendientes.push({id:nid(), texto:tx, imp:lim($("pImp").value,1,5,3), urg:lim($("pUrg").value,1,5,3), dur:lim($("pDur").value,15,600,60), ok:false, cuando:""}); guardar("pendientes"); }
    else if (b = q("[data-pag]")) hojaAgendar(b.dataset.pag);
    else if (b = q("[data-pdel]")) { DB.pendientes = DB.pendientes.filter(p => p.id !== b.dataset.pdel); guardar("pendientes"); }
    else if (q("[data-ta]")) { const n = $("tNuevo").value.trim(); if (!n) return; propio("tipos").push({id:"t" + nid(), nombre:n, color:"#5f7fa8"}); guardar("tipos"); }
    else if (b = q("[data-tq]")) { const l = propio("tipos"); if (l.length <= 1) { toast("Debe quedar al menos un tipo"); return; } l.splice(+b.dataset.tq, 1); guardar("tipos"); }
    else if (q("[data-json]")) descarga("actividades_" + hoy() + ".json", JSON.stringify({exportado:new Date().toISOString(), bloques:DB.bloques, tipos:G("tipos"), pendientes:DB.pendientes, dias:DB.dias}, null, 2), "application/json");
  }
  function cambioT(e){ const t = e.target, ds = t.dataset;
    if (ds.pr !== undefined) diaCambia(fecha, d => { d.prio = d.prio || ["","",""]; d.prio[+ds.pr] = t.value.trim(); }, true);
    else if (ds.hab) diaCambia(fecha, d => { d.hab = d.hab || {}; d.hab[ds.hab] = t.checked; }, true);
    else if (ds.j) diaCambia(fecha, d => { d.j = d.j || {}; d.j[ds.j] = t.value.trim(); }, true);
    else if (ds.pok) { const p = DB.pendientes.find(x => x.id === ds.pok); if (p) { p.ok = t.checked; guardar("pendientes"); } }
    else if (ds.tc !== undefined) { propio("tipos")[+ds.tc].color = t.value; guardar("tipos", true); }
    else if (ds.tn !== undefined) { const v = t.value.trim(); if (v) { propio("tipos")[+ds.tn].nombre = v; guardar("tipos", true); } }
  }
  MOD.tiempo = {monta, pinta:pintaT};
})();

/* ---------------- COMIDA ---------------- */
(function(){
  let sub = "hoy"; const META_P = 150, META_K = 2300, VASOS = 8, T = {D:"Desayuno",L:"Comida",C:"Cena"};
  const com = id => G("comidas").find(c => c.id === id);
  function monta(){
    $("main").innerHTML = segHTML("cSeg",[["hoy","Día"],["sem","Semana"],["banco","Banco"],["compras","Compras"]],sub) + '<div id="cv" class="col"></div>';
    $("cSeg").onclick = e => { const b = e.target.closest("[data-v]"); if (!b) return; sub = b.dataset.v; document.querySelectorAll("#cSeg button").forEach(x => x.setAttribute("aria-pressed", x === b)); pintaC(); };
    $("cv").onclick = clicC; $("cv").onchange = cambioC;
  }
  function pintaC(){ if (!$("cv")) return; ({hoy:vHoy, sem:vSem, banco:vBanco, compras:vCompras})[sub](); }
  const lunes = () => { const d = fechaDe(fecha); return mas(fecha, -((d.getDay() + 6) % 7)); };
  function vHoy(){
    const d = diaDe(fecha), c = d.com || {}, ent = d.ent || {}; let p = 0, k = 0;
    ["D","L","C"].forEach(t => { const x = com(c[t]); if (x) { p += +x.prot || 0; k += +x.kcal || 0; } });
    $("cv").innerHTML = barraFecha() + `
      <section class="panel"><div class="macro"><div><b>${p}</b><span>g de proteína de ${META_P}</span><div class="barra"><i style="width:${Math.min(100, p / META_P * 100)}%"></i></div></div>
        <div><b>${k}</b><span>kcal de ${META_K}</span><div class="barra"><i style="width:${Math.min(100, k / META_K * 100)}%;background:var(--warn)"></i></div></div></div></section>
      <section class="panel"><h3>Comidas del día</h3><div class="col" style="gap:10px">${["D","L","C"].map(t => `<label class="f">${T[t]}<select data-com="${t}"><option value="">Sin elegir</option>${G("comidas").filter(x => x.t === t).map(x => `<option value="${esc(x.id)}"${c[t] === x.id ? " selected" : ""}>${esc(x.nombre)} (${x.prot} g)</option>`).join("")}</select></label>`).join("")}</div></section>
      <section class="panel"><h3>Hidratación</h3><div class="agua"><button class="cu" data-agua="-1" aria-label="Quitar vaso">−</button><b>${d.agua || 0} <span class="aviso">de ${VASOS} vasos</span></b><button class="cu" data-agua="1" aria-label="Agregar vaso">+</button></div></section>
      <section class="panel"><h3>Actividad deportiva</h3><div class="dos"><label class="f">Tipo<select data-ent="tipo">${["","Gym","Bici","Caminata","Otro"].map(x => `<option${ent.tipo === x ? " selected" : ""} value="${x}">${x || "Ninguna"}</option>`).join("")}</select></label>
        <label class="f">Minutos<input data-ent="min" type="number" min="0" inputmode="numeric" value="${esc(ent.min)}"></label></div></section>
      <section class="panel"><h3>Suplementos</h3>${DB.suplementos.length ? DB.suplementos.map(s => `<div class="row"><label class="chk" style="flex:1"><input type="checkbox" data-sup="${esc(s.id)}"${(d.sup || {})[s.id] ? " checked" : ""}> ${esc(s.nombre)}</label><button class="lk" data-sdel="${esc(s.id)}">Quitar</button></div>`).join("") : '<div class="aviso">Agrega los suplementos que tomas para marcarlos cada día.</div>'}
        <div class="row" style="margin-top:8px"><input class="campo" id="sNuevo" placeholder="Nuevo suplemento" style="flex:1" autocomplete="off"><button class="btn" data-sa>Añadir</button></div></section>`;
  }
  function vSem(){
    const l = lunes();
    $("cv").innerHTML = `<div class="row"><button class="btn pri" data-gen>Generar semana variada</button><span class="aviso">Semana del ${esc(fCorta(l))}. Reemplaza las comidas de lunes a domingo.</span></div>
      <section class="panel">${[0,1,2,3,4,5,6].map(i => { const s = mas(l, i), c = diaDe(s).com || {}; let p = 0;
        const tx = ["D","L","C"].map(t => { const x = com(c[t]); if (x) p += +x.prot || 0; return x ? esc(x.nombre) : "—"; }).join(" · ");
        return `<div class="lin2"><span class="tx"><b>${esc(fCorta(s))}</b><small>${tx}</small></span><span class="mon">${p} g</span></div>`; }).join("")}</section>`;
  }
  function generar(){
    const l = lunes(), baraja = t => { const a = G("comidas").filter(x => x.t === t).map(x => x.id); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const B = {D:baraja("D"), L:baraja("L"), C:baraja("C")};
    for (let i = 0; i < 7; i++) { const s = mas(l, i); let d = DB.dias.find(x => x.id === s); if (!d) { d = {id:s}; DB.dias.push(d); }
      d.com = {}; ["D","L","C"].forEach(t => { if (B[t].length) d.com[t] = B[t][i % B[t].length]; }); }
    if (guardar("dias")) toast("Semana generada");
  }
  function vBanco(){
    $("cv").innerHTML = `<button class="btn pri" data-cn>Nueva comida</button>` + ["D","L","C"].map(t => `<section class="panel"><h3>${T[t]}</h3>${G("comidas").filter(x => x.t === t).map(x => `<div class="lin2"><span class="tx">${esc(x.nombre)}<small>${x.prot} g de proteína · ${x.kcal} kcal</small></span><button class="lk" data-ce="${esc(x.id)}">Editar</button></div>`).join("") || '<div class="aviso">Sin opciones.</div>'}</section>`).join("");
  }
  function vCompras(){
    const l = G("compras"), tiendas = [...new Set(l.map(x => x.tienda || "Otra"))], falta = l.filter(x => !x.ok).reduce((s,x) => s + (+x.precio || 0), 0);
    $("cv").innerHTML = `<section class="panel"><div class="cabp"><h3>Lista de compras</h3><button class="btn ch" data-cl>Desmarcar todo</button></div>
        ${tiendas.map(t => `<div class="sub" style="margin-top:8px">${esc(t)}</div>` + l.filter(x => (x.tienda || "Otra") === t).map(x => `<div class="lin2"><label class="chk tx"><input type="checkbox" data-cok="${esc(x.id)}"${x.ok ? " checked" : ""}> ${esc(x.nombre)}</label><span class="mon">${dinero(x.precio)}</span><button class="lk" data-cdel="${esc(x.id)}" aria-label="Quitar">×</button></div>`).join("")).join("")}
        <div class="sub" style="margin-top:10px">Falta por comprar: ${dinero(falta)}</div></section>
      <section class="panel"><h3>Agregar a la lista</h3><div class="col" style="gap:8px"><input class="campo" id="kN" placeholder="Producto" autocomplete="off">
        <div class="row"><input class="campo" id="kT" placeholder="Tienda" style="flex:1" autocomplete="off"><input class="campo" id="kP" type="number" min="0" placeholder="Precio" style="flex:1" inputmode="decimal"><button class="btn" data-ka>Añadir</button></div></div></section>`;
  }
  function hojaComida(id){
    const x = id ? com(id) : {t:"D",nombre:"",prot:"",kcal:""}; if (!x) return;
    abrir(cabeza(id ? "Editar comida" : "Nueva comida") + `<label class="f">Momento<select id="mT">${["D","L","C"].map(t => `<option value="${t}"${x.t === t ? " selected" : ""}>${T[t]}</option>`).join("")}</select></label>
      <label class="f">Descripción<input id="mN" value="${esc(x.nombre)}" autocomplete="off"></label>
      <div class="dos"><label class="f">Proteína (g)<input id="mP" type="number" min="0" inputmode="numeric" value="${esc(x.prot)}"></label><label class="f">Calorías<input id="mK" type="number" min="0" inputmode="numeric" value="${esc(x.kcal)}"></label></div>
      <div class="row">${id ? '<button class="btn peligro" id="mDel">Eliminar</button>' : ""}<span style="flex:1"></span><button class="btn pri" id="mOk">Guardar</button></div>`);
    $("mOk").onclick = () => { if (!$("mN").value.trim()) { toast("Escribe la descripción"); return; } const l = propio("comidas"), n = {id: id || "m" + nid(), t:$("mT").value, nombre:$("mN").value.trim(), prot:+$("mP").value || 0, kcal:+$("mK").value || 0};
      const i = l.findIndex(y => y.id === n.id); if (i >= 0) l[i] = n; else l.push(n); cerrar(); if (guardar("comidas")) toast("Comida guardada"); };
    if (id) dosPasos($("mDel"), () => { DB.comidas = propio("comidas").filter(y => y.id !== id); cerrar(); guardar("comidas"); });
  }
  function clicC(e){
    if (clicFecha(e)) return; const q = s => e.target.closest(s); let b;
    if (b = q("[data-agua]")) diaCambia(fecha, d => { d.agua = Math.max(0, (d.agua || 0) + +b.dataset.agua); });
    else if (q("[data-gen]")) generar();
    else if (q("[data-sa]")) { const n = $("sNuevo").value.trim(); if (!n) return; DB.suplementos.push({id:"s" + nid(), nombre:n}); guardar("suplementos"); }
    else if (b = q("[data-sdel]")) { DB.suplementos = DB.suplementos.filter(s => s.id !== b.dataset.sdel); guardar("suplementos"); }
    else if (q("[data-cn]")) hojaComida(null);
    else if (b = q("[data-ce]")) hojaComida(b.dataset.ce);
    else if (q("[data-cl]")) { propio("compras").forEach(x => x.ok = false); guardar("compras"); }
    else if (b = q("[data-cdel]")) { DB.compras = propio("compras").filter(x => x.id !== b.dataset.cdel); guardar("compras"); }
    else if (q("[data-ka]")) { const n = $("kN").value.trim(); if (!n) { toast("Escribe el producto"); return; } propio("compras").push({id:"k" + nid(), nombre:n, tienda:$("kT").value.trim() || "Otra", precio:+$("kP").value || 0, ok:false}); guardar("compras"); }
  }
  function cambioC(e){ const t = e.target, ds = t.dataset;
    if (ds.com) diaCambia(fecha, d => { d.com = d.com || {}; d.com[ds.com] = t.value; });
    else if (ds.ent) diaCambia(fecha, d => { d.ent = d.ent || {}; d.ent[ds.ent] = t.value; }, true);
    else if (ds.sup) diaCambia(fecha, d => { d.sup = d.sup || {}; d.sup[ds.sup] = t.checked; }, true);
    else if (ds.cok) { const x = propio("compras").find(y => y.id === ds.cok); if (x) { x.ok = t.checked; guardar("compras"); } }
  }
  MOD.comida = {monta, pinta:pintaC};
})();

/* ---------------- FINANZAS ---------------- */
(function(){
  function monta(){ $("main").innerHTML = '<div id="fv" class="col"></div>'; $("fv").onclick = e => { const q = s => e.target.closest(s); let b;
    if (q("[data-fn]")) hoja(null); else if (b = q("[data-fe]")) hoja(b.dataset.fe); else if (q("[data-fx]")) excel(); }; }
  const suma = t => DB.cuentas.filter(c => c.tipo === t).reduce((s,c) => s + (+c.saldo || 0), 0);
  function pintaF(){ if (!$("fv")) return; const d = suma("debito"), c = suma("credito");
    const lista = t => { const l = DB.cuentas.filter(x => x.tipo === t); return l.length ? l.map(x => `<button class="item" data-fe="${esc(x.id)}"><span class="tx"><span class="nm">${esc(x.nombre)}</span><span class="mt">${esc(x.objetivo || "Sin objetivo")}${x.corte ? " · corte " + esc(x.corte) : ""}</span></span><span class="fz" style="color:${t === "credito" ? "var(--bad)" : "var(--ink)"}">${dinero(x.saldo)}</span></button>`).join("") : '<div class="aviso">Sin cuentas todavía.</div>'; };
    $("fv").innerHTML = `<section class="panel"><div class="tot"><div><b>${dinero(d)}</b><span>Tengo (débito)</span></div><div><b style="color:var(--bad)">${dinero(c)}</b><span>Debo (crédito)</span></div><div><b style="color:${d - c >= 0 ? "var(--ok)" : "var(--bad)"}">${dinero(d - c)}</b><span>Neto</span></div></div></section>
      <div class="row"><button class="btn pri" data-fn>Nueva cuenta</button><button class="btn" data-fx>Exportar a Excel</button></div>
      <section class="panel"><h3>Cuentas de débito</h3><div class="lista">${lista("debito")}</div></section>
      <section class="panel"><h3>Crédito por pagar</h3><div class="lista">${lista("credito")}</div></section>`; }
  function hoja(id){
    const x = id ? DB.cuentas.find(c => c.id === id) : {nombre:"",tipo:"debito",objetivo:"",saldo:"",corte:""}; if (!x) return;
    abrir(cabeza(id ? "Editar cuenta" : "Nueva cuenta") + `<label class="f">Nombre<input id="uN" value="${esc(x.nombre)}" placeholder="Por ejemplo: BBVA débito" autocomplete="off"></label>
      <label class="f">Tipo<select id="uT"><option value="debito"${x.tipo === "debito" ? " selected" : ""}>Débito (dinero que tengo)</option><option value="credito"${x.tipo === "credito" ? " selected" : ""}>Crédito (dinero que debo)</option></select></label>
      <label class="f">Objetivo de la cuenta<input id="uO" value="${esc(x.objetivo)}" placeholder="Fondo de emergencia, gasto corriente…" autocomplete="off"></label>
      <div class="dos"><label class="f">Saldo al corte<input id="uS" type="number" step="0.01" inputmode="decimal" value="${esc(x.saldo)}"></label><label class="f">Fecha de corte<input id="uC" type="date" value="${esc(x.corte)}"></label></div>
      <div class="row">${id ? '<button class="btn peligro" id="uDel">Eliminar cuenta</button>' : ""}<span style="flex:1"></span><button class="btn pri" id="uOk">Guardar</button></div>`);
    $("uOk").onclick = () => { if (!$("uN").value.trim()) { toast("Ponle nombre a la cuenta"); return; }
      const n = {id: id || nid(), nombre:$("uN").value.trim(), tipo:$("uT").value, objetivo:$("uO").value.trim(), saldo:parseFloat($("uS").value) || 0, corte:$("uC").value};
      const i = DB.cuentas.findIndex(c => c.id === n.id); if (i >= 0) DB.cuentas[i] = n; else DB.cuentas.push(n); cerrar(); if (guardar("cuentas")) toast("Cuenta guardada"); };
    if (id) dosPasos($("uDel"), () => { DB.cuentas = DB.cuentas.filter(c => c.id !== id); cerrar(); guardar("cuentas"); });
  }
  function excel(){
    if (typeof XLSX === "undefined") { toast("No se pudo cargar el generador de Excel; revisa tu conexión"); return; }
    const f = DB.cuentas.map(c => ({Nombre:c.nombre, Tipo:c.tipo === "debito" ? "Débito" : "Crédito por pagar", Objetivo:c.objetivo || "", "Saldo al corte":+c.saldo || 0, "Fecha de corte":c.corte || ""}));
    const d = suma("debito"), c = suma("credito"); f.push({}, {Nombre:"TOTAL DÉBITO","Saldo al corte":d}, {Nombre:"TOTAL CRÉDITO","Saldo al corte":c}, {Nombre:"NETO","Saldo al corte":d - c});
    const ws = XLSX.utils.json_to_sheet(f, {header:["Nombre","Tipo","Objetivo","Saldo al corte","Fecha de corte"]}); ws["!cols"] = [{wch:24},{wch:18},{wch:28},{wch:16},{wch:16}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Cuentas"); XLSX.writeFile(wb, "finanzas_" + hoy() + ".xlsx");
  }
  MOD.finanzas = {monta, pinta:pintaF};
})();

irA("social");
arrancar();
</script>
</body>
</html>
